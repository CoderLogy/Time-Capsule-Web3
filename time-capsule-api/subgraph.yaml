specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: TimeCapsule
    network: sepolia
    source:
      address: "0x19FF5dc69033523f1C5b1B5589f95D49b5EF7926"
      abi: TimeCapsule
      startBlock: 10284151
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - CapsuleCreated
        - CapsuleOpened
      abis:
        - name: TimeCapsule
          file: ./abis/TimeCapsule.json
      eventHandlers:
        - event: CapsuleCreated(indexed address,indexed uint256,string,uint256,string)
          handler: handleCapsuleCreated
        - event: CapsuleOpened(indexed address,indexed uint256,string,string)
          handler: handleCapsuleOpened
      file: ./src/time-capsule.ts
