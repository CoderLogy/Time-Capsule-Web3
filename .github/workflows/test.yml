name: Tests & Validation

on:
    push:
        branches: [main, develop, test]
    pull_request:
        branches: [main, develop]
        
permissions:
  contents: read
  actions: read

jobs:
    test:
        name: Run Tests
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 8

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20.x
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --no-frozen-lockfile

            - name: Run Vitest
              run: pnpm vitest --run --reporter=verbose
              env:
                  VITE_CONTRACT_ADDRESS: "0x0000000000000000000000000000000000000000"
                  VITE_CHAIN_ID: "11155111"

            - name: Notify Vercel
              uses: vercel/repository-dispatch/actions/status@v1
              with:
                  name: 'Vercel - testtimecapsuleweb3: test'
                  github_token: ${{ secrets.GITHUB_TOKEN }}

            - name: Generate test report
              if: always()
              run: pnpm vitest --run --reporter=json > test-results.json 2>&1 || true
              env:
                  VITE_CONTRACT_ADDRESS: "0x0000000000000000000000000000000000000000"
                  VITE_CHAIN_ID: "11155111"

            - name: Upload test results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: test-results
                  path: test-results.json

    file-safety:
        name: File Safety Check
        runs-on: ubuntu-latest
        timeout-minutes: 5

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Check for deleted critical files
              id: check-deleted
              run: |
                  DELETED_FILES=$(git diff --name-only --diff-filter=D HEAD~1 HEAD 2>/dev/null || echo "")
                  CRITICAL_FILES=(
                    "src/lib/errors.ts"
                    "src/lib/encrypt-decrypt.ts"
                    "tests/unit/error-handling.test.ts"
                    "tests/unit/errors.test.ts"
                    "tests/integration/capsule-encryption.test.ts"
                    "package.json"
                    "pnpm-lock.yaml"
                  )

                  FOUND_DELETED=0
                  for CRITICAL in "${CRITICAL_FILES[@]}"; do
                    if echo "$DELETED_FILES" | grep -q "^$CRITICAL$"; then
                      echo "❌ CRITICAL FILE DELETED: $CRITICAL"
                      FOUND_DELETED=1
                    fi
                  done

                  if [ $FOUND_DELETED -eq 1 ]; then
                    echo "status=failed" >> $GITHUB_OUTPUT
                    exit 1
                  else
                    echo "status=passed" >> $GITHUB_OUTPUT
                    echo "✅ All critical files are safe"
                  fi

            - name: Check for modified protected files
              id: check-modified
              run: |
                  MODIFIED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
                  PROTECTED_FILES=(
                    "src/lib/errors.ts"
                    ".github/workflows/"
                    "package.json"
                  )

                  echo "📋 Protected files modified:"
                  for PROTECTED in "${PROTECTED_FILES[@]}"; do
                    if echo "$MODIFIED_FILES" | grep -q "$PROTECTED"; then
                      echo "  ⚠️  $PROTECTED"
                    fi
                  done

            - name: Check test files exist
              run: |
                  TEST_FILES=(
                    "tests/unit/error-handling.test.ts"
                    "tests/unit/errors.test.ts"
                    "tests/integration/capsule-encryption.test.ts"
                  )

                  for TEST_FILE in "${TEST_FILES[@]}"; do
                    if [ ! -f "$TEST_FILE" ]; then
                      echo "❌ MISSING TEST FILE: $TEST_FILE"
                      exit 1
                    else
                      echo "✅ Found: $TEST_FILE"
                    fi
                  done

    quality-checks:
        name: Code Quality
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 8

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20.x
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --no-frozen-lockfile

            - name: Check TypeScript compilation
              run: pnpm tsc --noEmit 2>&1 || true

            - name: Verify package.json structure
              run: |
                  echo "✅ Checking package.json..."
                  node -e "const pkg = require('./package.json'); console.log('  - Version:', pkg.version); console.log('  - Name:', pkg.name);"

            - name: Check for console.debug in production code
              run: |
                  RESULT=$(grep -r "console\.debug" src/ --include="*.ts" --include="*.tsx" || true)
                  if [ -z "$RESULT" ]; then
                    echo "✅ No console.debug statements found"
                  else
                    echo "⚠️  Found console.debug statements:"
                    echo "$RESULT"
                  fi

    report:
        name: Test Report
        runs-on: ubuntu-latest
        if: always()
        needs: [test, file-safety, quality-checks]

        steps:
            - name: Download test results
              uses: actions/download-artifact@v4
              continue-on-error: true

            - name: Generate summary
              run: |
                  echo "## ✅ Test Summary" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "**Status:**" >> $GITHUB_STEP_SUMMARY
                  echo "- Tests: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
                  echo "- File Safety: ${{ needs.file-safety.result }}" >> $GITHUB_STEP_SUMMARY
                  echo "- Quality: ${{ needs.quality-checks.result }}" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "**Details:**" >> $GITHUB_STEP_SUMMARY
                  echo "- 35 Unit & Integration Tests" >> $GITHUB_STEP_SUMMARY
                  echo "- Critical Files Protected" >> $GITHUB_STEP_SUMMARY
                  echo "- TypeScript Type Checking" >> $GITHUB_STEP_SUMMARY

            - name: Fail if any job failed
              if: |
                  needs.test.result == 'failure' ||
                  needs.file-safety.result == 'failure' ||
                  needs.quality-checks.result == 'failure'
              run: |
                  echo "❌ One or more checks failed!"
                  exit 1

            - name: Success message
              if: success()
              run: echo "🎉 All checks passed!"