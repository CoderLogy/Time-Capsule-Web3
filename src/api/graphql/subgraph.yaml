specVersion: 1.3.0
description: TimeCapsule subgraph
repository: https://github.com/CoderLogy/Time-Capsule-Web3
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: TimeCapsule
    network: sepolia 
    source:
      address: "0x23d2F3709385616f87206FAc06F3711b5aEfFc10"
      abi: TimeCapsule
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.5
      language: wasm/assemblyscript
      entities:
        - CapsuleEntity
      abis:
        - name: TimeCapsule
          file: .../.../contracts/TimeCapsule.json
      eventHandlers:
        - event: CapsuleCreated(address,uint256,uint256,string)
          handler: handleCapsuleCreated
        - event: CapsuleOpened(address,uint256,string)
          handler: handleCapsuleOpened
      file: ./api/mapping.ts
